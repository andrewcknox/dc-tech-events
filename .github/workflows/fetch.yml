name: Fetch via Anthropic API (optional, manual)

# Only useful if config.yaml has `extraction: api` and the ANTHROPIC_API_KEY secret is set.
# The normal path is the scheduled Claude desktop task (see DAILY.md).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra js
      - run: uv run playwright install --with-deps chromium
      - name: Fetch, classify, geocode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run dte fetch
      - name: Write pending review file
        run: uv run dte review
      - name: Commit database and review file
        run: |
          git config user.name "dc-tech-events bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.db review/
          git diff --cached --quiet || git commit -m "fetch: $(date -u +%F)"
          git push
