# Event sources. Edit this file to add or remove a source — nothing else needs to change.
#
# Fields:
#   name     : short label shown in the digest and on the map
#   url      : the page or feed to pull from
#   type     : ics | rss | html | eventbrite_org
#              ics/rss  = machine-readable feed (cheapest, most reliable; prefer these)
#              html     = a normal web page; Claude reads it and pulls out the events
#              eventbrite_org = an Eventbrite organizer page (scraped via its embedded JSON)
#   js       : true if the page only shows events after JavaScript runs (needs Playwright)
#   tags     : free-form labels, e.g. [sais, think-tank, university]
#   enabled  : false to pause a source without deleting it
#
# Run `uv run dte probe` to check whether a URL works and whether a feed exists.

sources:
