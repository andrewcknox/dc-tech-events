[project]
name = "dc-tech-events"
version = "0.1.0"
description = "Tracks emerging-tech policy events in Washington DC and maps them."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "requests>=2.32",
    "selectolax>=0.3.21",
    "feedparser>=6.0",
    "icalendar>=6.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
js = ["playwright>=1.45"]

[project.scripts]
dte = "dte.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
