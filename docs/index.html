ea", "industrial-policy"], "tags": ["think-tank"], "fit": 3, "why": "Allied economic security; invitation only.", "description": "Invite-only conversation with JBIC's Hiroyuki Nakashima on US-Japan economic security cooperation.", "speakers": ["Hiroyuki Nakashima", "Nick Snyder"], "lat": 38.896, "lon": -77.0286, "in_dc": true, "time": "10:00 AM–11:00 AM", "where": "Hudson Institute, 1201 Pennsylvania Ave NW"}, {"id": 113, "title": "National Economic Power Industry War Conference", "start": "2026-11-17T00:00:00-05:00", "end": null, "host": "ITIF", "source": "daily page scan 2026-09-15", "location": "Washington, DC", "virtual": false, "url": "https://itif.org/events/2026/11/17/national-power-industry-war-conference/", "topics": ["China", "industrial-policy", "semiconductors"], "tags": ["think-tank"], "fit": 4, "why": "ITIF's flagship conference on the techno-economic contest with China.", "description": "Policy conference on how the U.S. can avoid defeat in its techno-economic competition with China in advanced traded-sector industries.", "speakers": [], "lat": 38.9024, "lon": -77.0221, "in_dc": true, "time": "time TBD", "where": "Washington, DC"}, {"id": 130, "title": "The state of broadband access and affordability", "start": "2026-11-18T13:30:00-05:00", "end": "2026-11-18T14:45:00-05:00", "host": "Brookings", "source": "daily page scan 2026-11-04", "location": "Brookings Institution, 1775 Massachusetts Ave NW", "virtual": false, "url": "https://www.brookings.edu/events/the-state-of-broadband-access-and-affordability/", "topics": ["industrial-policy"], "tags": ["think-tank"], "fit": 3, "why": "Telecom policy; domestic but relevant to digital infrastructure debates.", "description": "Panel on U.S. broadband access, affordability and telecom policy.", "speakers": [], "lat": 38.9093, "lon": -77.041, "in_dc": true, "time": "1:30 PM–2:45 PM", "where": "Brookings Institution, 1775 Massachusetts Ave NW"}, {"id": 139, "title": "Rebuilding the Arsenal of Freedom and Reindustrializing America", "start": "2026-11-18T14:00:00-05:00", "end": "2026-11-18T15:00:00-05:00", "host": "Hudson Institute", "source": "daily page scan 2026-11-04", "location": "Hudson Institute, 1201 Pennsylvania Ave NW", "virtual": false, "url": "https://www.hudson.org/events/rebuilding-arsenal-freedom-reindustrializing-america", "topics": ["industrial-policy"], "tags": ["think-tank"], "fit": 3, "why": "Defense-industrial policy from the HASC chair.", "description": "HASC Chairman Mike Rogers with Nadia Schadlow on Congress's role in revitalizing the defense industrial base.", "speakers": ["Mike Rogers", "Nadia Schadlow"], "lat": 38.896, "lon": -77.0286, "in_dc": true, "time": "2:00 PM–3:00 PM", "where": "Hudson Institute, 1201 Pennsylvania Ave NW"}, {"id": 146, "title": "Foreign Threats to Free Speech and Domestic Policy Responses", "start": "2026-11-20T12:00:00-05:00", "end": "2026-11-20T13:00:00-05:00", "host": "R Street Institute", "source": "daily page scan 2026-11-04", "location": "R Street Institute, 1411 K St NW", "virtual": false, "url": "https://www.rstreet.org/events/foreign-threats-to-free-speech-and-domestic-policy-responses/", "topics": ["trust-and-safety", "EU"], "tags": ["think-tank"], "fit": 3, "why": "Platform-speech regulation and transatlantic friction.", "description": "In-person discussion of foreign threats to free speech, such as overseas content rules, and U.S. policy responses.", "speakers": [], "lat": 38.9024, "lon": -77.0326, "in_dc": true, "time": "12:00 PM–1:00 PM", "where": "R Street Institute, 1411 K St NW"}, {"id": 131, "title": "What is next for the US-China AI safety dialogue?", "start": "2026-11-23T10:00:00-05:00", "end": "2026-11-23T11:00:00-05:00", "host": "Brookings", "source": "daily page scan 2026-11-04", "location": null, "virtual": true, "url": "https://www.brookings.edu/events/what-is-next-for-the-us-china-ai-safety-dialogue/", "topics": ["AI", "China", "tech-geopolitics"], "tags": ["think-tank"], "fit": 5, "why": "US-China const events = (DATA && DATA.events) || [];
const TODAY = DATA ? DATA.today : new Date().toISOString().slice(0,10);
const fmtDay = iso => new Date(iso).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };

document.getElementById('sub').textContent = DATA
  ? `${events.length} events in the database window · updated ${DATA.generated_at.slice(0,16).replace('T',' ')}`
  : 'no data yet';
if (DATA && DATA.other_pages) document.getElementById('nav').innerHTML = DATA.other_pages.map(([f,t]) => `<a href="${f}">${esc(t)} →</a>`).join('');

// ---- map ----
const map = L.map('map').setView(DATA ? DATA.map_center : [38.905,-77.036], DATA ? DATA.map_zoom : 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom:19
}).addTo(map);
const group = L.featureGroup().addTo(map);
const markers = {};
function pinIcon(n, grey) {
  return L.divIcon({ className:'', html:`<div class="marker-pin${grey?' grey':''}"><span>${n}</span></div>`, iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-24] });
}
function popupHtml(e) {
  const chips = e.topics.map(t => `<span class="chip static">${t}</span>`).join(' ');
  return `<b>${e.n}. ${esc(e.title)}</b>${esc(e.host)} · ${fmtDay(e.start)} · ${e.time}<br>${esc(e.where)}<br>
    <div style="margin:4px 0">${chips}</div><i>${esc(e.why||'')}</i><br>${e.url ? `<a href="${e.url}" target="_blank" rel="noopener">Event page ↗</a>` : ''}`;
}

// ---- state ----
const state = { from: TODAY, to: addDays(TODAY, 14), tod: new Set(['morning','afternoon','evening','tbd']), topics: new Set(), virtual: true, hill: false };
const fromEl = document.getElementById('from'), toEl = document.getElementById('to');
function setRange(kind) {
  const d = new Date(TODAY + 'T00:00:00'); const dow = (d.getDay() + 6) % 7; // Monday=0
  if (kind === 'week') { state.from = addDays(TODAY, -dow); state.to = addDays(state.from, 7); }
  else if (kind === 'past') { state.from = addDays(TODAY, -90); state.to = TODAY; }
  else if (kind === 'all') { state.from = addDays(TODAY, -90); state.to = addDays(TODAY, 90); }
  else { state.from = TODAY; state.to = addDays(TODAY, +kind); }
  fromEl.value = state.from; toEl.value = state.to;
  document.querySelectorAll('[data-range]').forEach(c => c.classList.toggle('on', c.dataset.range === kind));
  render();
}
document.querySelectorAll('[data-range]').forEach(c => c.onclick = () => setRange(c.dataset.range));
fromEl.onchange = () => { state.from = fromEl.value; document.querySelectorAll('[data-range]').forEach(c => c.classList.remove('on')); render(); };
toEl.onchange = () => { state.to = toEl.value; document.querySelectorAll('[data-range]').forEach(c => c.classList.remove('on')); render(); };
document.querySelectorAll('[data-tod]').forEach(c => c.onclick = () => { const k = c.dataset.tod; state.tod.has(k) ? state.tod.delete(k) : state.tod.add(k); c.classList.toggle('on', state.tod.has(k)); render(); });
const virtChip = document.getElementById('virtChip'); virtChip.onclick = () => { state.virtual = !state.virtual; virtChip.classList.toggle('on', state.virtual); render(); };
const hillChip = document.getElementById('hillChip'); hillChip.onclick = () => { state.hill = !state.hill; hillChip.classList.toggle('on', state.hill); render(); };
const hasHill = events.some(e => e.tags.includes('hill'));
if (!hasHill) hillChip.style.display = 'none';

const topicsEl = document.getElementById('topics');
const allTopics = [...new Set(events.flatMap(e => e.topics))].sort();
const allChip = document.createElement('span'); allChip.className = 'chip on'; allChip.textContent = 'All';
allChip.onclick = () => { state.topics.clear(); render(); };
topicsEl.appendChild(allChip);
allTopics.forEach(t => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = t; c.onclick = () => { state.topics.has(t) ? state.topics.delete(t) : state.topics.add(t); render(); }; topicsEl.appendChild(c); });

if (DATA && DATA.flagged_sources && DATA.flagged_sources.length)
  document.getElementById('warn').innerHTML = `<div class="warn">⚠ Sources failing repeatedly: ${DATA.flagged_sources.map(f => esc(f.name)+' ('+f.failures+')').join(', ')}. Check sources.yaml.</div>`;

function todOf(e) { const h = new Date(e.start).getHours(), m = new Date(e.start).getMinutes(); if (h === 0 && m === 0) return 'tbd'; return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'; }
function visible(e) {
  const day = e.start.slice(0,10);
  if (day < state.from || day > state.to) return false;
  if (!state.tod.has(todOf(e))) return false;
  if (state.topics.size && !e.topics.some(t => state.topics.has(t))) return false;
  if (!state.virtual && e.lat == null) return false;
  if (!state.hill && e.tags.includes('hill')) return false;
  return true;
}

function render() {
  [...topicsEl.children].forEach(c => { if (c !== allChip) c.classList.toggle('on', state.topics.has(c.textContent)); });
  allChip.classList.toggle('on', state.topics.size === 0);
  group.clearLayers();
  const vis = events.filter(visible);
  vis.forEach((e, i) => e.n = i + 1);
  vis.forEach(e => {
    if (e.lat == null) return;
    const past = e.start.slice(0,10) < TODAY;
    const m = L.marker([e.lat, e.lon], { icon: pinIcon(e.n, past || !e.in_dc) }).bindPopup(popupHtml(e));
    m.on('click', () => highlight(e.id));
    markers[e.id] = m; group.addLayer(m);
  });
  const dcPins = vis.filter(e => e.lat != null && e.in_dc).map(e => [e.lat, e.lon]);
  if (dcPins.length) map.fitBounds(L.latLngBounds(dcPins).pad(0.15), { maxZoom: 15 });
  else if (group.getLayers().length) map.fitBounds(group.getBounds().pad(0.15), { maxZoom: 15 });
  document.getElementById('count').textContent = `${vis.length} events · ${state.from} to ${state.to}`;
  const list = document.getElementById('list'); list.innerHTML = '';
  if (!vis.length) { list.innerHTML = '<div class="empty">Nothing matches these filters.</div>'; return; }
  let lastDay = '';
  vis.forEach(e => {
    const day = e.start.slice(0,10);
    if (day !== lastDay) { const d = document.createElement('div'); d.className = 'day' + (day === TODAY ? ' today' : ''); d.textContent = fmtDay(e.start) + (day === TODAY ? ' · today' : ''); list.appendChild(d); lastDay = day; }
    const past = day < TODAY;
    const div = document.createElement('div'); div.className = 'ev' + (past ? ' past' : ''); div.id = 'ev-' + e.id;
    const numCls = e.lat == null ? 'num virt' : (past || !e.in_dc ? 'num grey' : 'num');
    const tagChips = e.tags.filter(t => t !== 'sais-internal').map(t => `<span class="chip static tag">${esc(t)}</span>`).join('');
    div.innerHTML = `<div class="t"><span class="${numCls}">${e.lat == null ? '~' : e.n}</span>${esc(e.title)}</div>
      <div class="m">${esc(e.host)} · ${e.time} · ${esc(e.where)}</div>
      <div class="w">${esc(e.why || '')}</div>
      <div class="chips">${e.topics.map(t => `<span class="chip static">${t}</span>`).join('')}${tagChips} ${e.url ? `<a href="${e.url}" target="_blank" rel="noopener">event page ↗</a>` : ''}</div>`;
    div.onclick = ev => { if (ev.target.tagName === 'A') return; highlight(e.id); const m = markers[e.id]; if (m) { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15)); m.openPopup(); } };
    list.appendChild(div);
  });
}
function highlight(id) { document.querySelectorAll('.ev.active').forEach(x => x.classList.remove('active')); const d = document.getElementById('ev-' + id); if (d) { d.classList.add('active'); d.scrollIntoView({ block: 'nearest' }); } }
setRange('14');
</script>
