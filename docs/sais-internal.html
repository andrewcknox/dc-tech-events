    const past = e.start.slice(0,10) < TODAY;
    const m = L.marker([e.lat, e.lon], { icon: pinIcon(e.n, past || !e.in_dc) }).bindPopup(popupHtml(e));
    m.on('click', () => highlight(e.id));
    markers[e.id] = m; group.addLayer(m);
  });
  const inBox = vis.filter(e => e.lat != null && e.in_dc);
  REG.regions.forEach(r => { document.getElementById('rc-' + r.key).textContent = inBox.filter(e => inRegion(e, r.key)).length; });
  frame(vis);
  document.getElementById('count').textContent = `${vis.length} events · ${state.from} to ${state.to}`;
  const list = document.getElementById('list'); list.innerHTML = '';
  if (!vis.length) { list.innerHTML = '<div class="empty">Nothing matches these filters.</div>'; return; }
  let lastDay = '';
  vis.forEach(e => {
    const day = e.start.slice(0,10);
    if (day !== lastDay) { const d = document.createElement('div'); d.className = 'day' + (day === TODAY ? ' today' : ''); d.textContent = fmtDay(e.start) + (day === TODAY ? ' · today' : ''); list.appendChild(d); lastDay = day; }
    const past = day < TODAY;
    const div = document.createElement('div'); div.className = 'ev' + (past ? ' past' : ''); div.id = 'ev-' + e.id;
    const numCls = e.lat == null ? 'num virt' : (past || !e.in_dc ? 'num grey' : 'num');
    const tagChips = e.tags.filter(t => t !== 'sais-internal').map(t => `<span class="chip static tag">${esc(t)}</span>`).join('');
    div.innerHTML = `<div class="t"><span class="${numCls}">${e.lat == null ? '~' : e.n}</span>${esc(e.title)}</div>
      <div class="m">${esc(e.host)} · ${e.time} · ${esc(e.where)}</div>
      <div class="w">${esc(e.why || '')}</div>
      <div class="chips">${e.topics.map(t => `<span class="chip static">${t}</span>`).join('')}${tagChips} ${e.url ? `<a href="${e.url}" target="_blank" rel="noopener">event page ↗</a>` : ''}</div>`;
    div.onclick = ev => { if (ev.target.tagName === 'A') return; highlight(e.id); const m = markers[e.id]; if (m) { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15)); m.openPopup(); } };
    list.appendChild(div);
  });
}
function highlight(id) { document.querySelectorAll('.ev.active').forEach(x => x.classList.remove('active')); const d = document.getElementById('ev-' + id); if (d) { d.classList.add('active'); d.scrollIntoView({ block: 'nearest' }); } }
setRange('14');
</script>
</body>
