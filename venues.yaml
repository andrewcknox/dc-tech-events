# Known venues. The map uses these before asking an online geocoder, so adding a venue here
# is the fastest way to fix a pin that landed in the wrong place.
#
# match   : words to look for (case-insensitive) in an event's location OR host organisation
# address : human-readable, shown in the map popup
# lat/lon : decimal degrees
#
# Tip: Google Maps -> right-click a spot -> the first line is "lat, lon".

